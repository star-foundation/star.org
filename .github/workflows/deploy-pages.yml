name: Build and deploy site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'site.config.json'
      - '.github/workflows/deploy-pages.yml'
      # 共享 action 决定渲染环境（Chrome/中文字体）。改动它会影响站点构建产物，
      # 但原先不在 paths 里，改了不会触发重建——站点会悄悄停在旧产物上。
      - '.github/actions/**'
      # 内置字体参与 OG 图渲染，改了字体产物就会变
      - 'fonts/**'
  # 认领由 register.yml 用 GITHUB_TOKEN 提交，GitHub 防循环机制下这种提交不会触发
  # 上面的 on:push（否则无限循环），所以客户认领后站点不会自动重建、页面一直 404。
  # 因此必须用 workflow_run 在「认领」跑完后强制重建（下面 build job 再按是否成功过滤）。
  workflow_run:
    workflows: [Claim registration (runs after successful payment)]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # rebuild after successful registration, or on push/dispatch
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      # 镜像自带 Node 22（满足 package.json 的 engines: >=20），
      # 原先 setup-node 请求 Node 20 不在镜像缓存里，每次要下载一遍（实测 5s）。
      # 这里改为直接用镜像的 Node，并显式断言版本，避免悄悄跑在过旧的运行时上。
      - name: Verify Node version
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) { console.error('Node 版本过低：' + process.versions.node); process.exit(1); }"
      - name: Set up render environment (Chrome + bundled CJK fonts)
        uses: ./.github/actions/setup-render-env
      - name: Build static site
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://star.org' }}
          LEMON_SQUEEZY_CHECKOUT_URL: ${{ vars.LEMON_SQUEEZY_CHECKOUT_URL }}
          REGISTRY_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ ! -x "${CHROME_PATH:-}" ]; then echo "::warning::Chrome unavailable; skipping the default OG image render"; fi
          node scripts/build-site.mjs
      - name: Pre-deploy self-check (registry integrity + compliance copy)
        run: |
          node scripts/verify-registry.mjs
          node scripts/check-compliance.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
