name: 构建并发布站点（GitHub Pages）

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'site.config.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装中文字体与 Chrome（用于生成默认 OG 图）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          # Ubuntu 24.04 的 chromium-browser 是 snap 占位包，无法在 CI 中直接使用，
          # 因此改用 Google 官方 apt 源安装 google-chrome-stable（提供 /usr/bin/google-chrome）
          # 注意：gpg 不能以 sudo 运行（无 TTY 时会报 cannot open /dev/tty），
          # 改为普通用户解钥、再用 sudo install 落盘
          wget -q -O /tmp/google-chrome.pub https://dl-ssl.google.com/linux/linux_signing_key.pub
          gpg --no-tty --batch --yes --dearmor -o /tmp/google-chrome.gpg /tmp/google-chrome.pub
          sudo install -D -m 0644 /tmp/google-chrome.gpg /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable
          google-chrome --version
      - name: 生成静态站点
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://star.org' }}
          LEMON_SQUEEZY_CHECKOUT_URL: ${{ vars.LEMON_SQUEEZY_CHECKOUT_URL }}
          REGISTRY_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_PATH" ]; then echo "::warning::Chrome 未安装成功，将跳过默认 OG 图渲染"; fi
          node scripts/build-site.mjs
      - name: 上线前自检（登记表完整性 + 合规文案）
        run: |
          node scripts/verify-registry.mjs
          node scripts/check-compliance.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
