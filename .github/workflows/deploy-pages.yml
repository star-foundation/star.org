name: 构建并发布站点（GitHub Pages）

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/**'
      - 'site.config.json'
      - '.github/workflows/deploy-pages.yml'
  # 登记由 register.yml 用 GITHUB_TOKEN 提交，GitHub 防循环机制下这种提交不会触发
  # 上面的 on:push（否则无限循环），所以客户登记后站点不会自动重建、页面一直 404。
  # 因此必须用 workflow_run 在「登记」跑完后强制重建（下面 build job 再按是否成功过滤）。
  workflow_run:
    workflows: [登记（支付成功后自动执行）]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # rebuild after successful registration, or on push/dispatch
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 准备渲染环境（中文字体 + Chrome）
        uses: ./.github/actions/setup-render-env
      - name: 生成静态站点
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://star.org' }}
          LEMON_SQUEEZY_CHECKOUT_URL: ${{ vars.LEMON_SQUEEZY_CHECKOUT_URL }}
          REGISTRY_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_PATH" ]; then echo "::warning::Chrome 未安装成功，将跳过默认 OG 图渲染"; fi
          node scripts/build-site.mjs
      - name: 上线前自检（登记表完整性 + 合规文案）
        run: |
          node scripts/verify-registry.mjs
          node scripts/check-compliance.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
