name: Claim registration (runs after successful payment)

# 触发方式：
#   1. repository_dispatch —— Lemon Squeezy Webhook → Zapier/Make → GitHub API（正式链路）
#   2. workflow_dispatch   —— 人工补单 / 重发证书（对应 TC-ERR-02 的补单能力）
on:
  repository_dispatch:
    types: [star_registration]
  workflow_dispatch:
    inputs:
      order_id:
        description: 'Order ID (Lemon Squeezy order ID; used for idempotency and manual re-issue tracing)'
        required: false
      display_name:
        description: 'Claimer name (shown on the certificate and the permanent page)'
        required: true
      email:
        description: 'Email address that receives the certificate'
        required: false
      dedication:
        description: 'Dedication (optional; truncated beyond 100 characters)'
        required: false
      anonymous:
        description: 'Show anonymously (true/false)'
        required: false
        default: 'false'

# 关键：同一时刻只允许一个认领流程在跑，天然避免两笔订单抢到同一颗星（TC-ALLOC-03）
concurrency:
  group: star-registration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 只需要最新一份树；完整历史会随每次认领提交的证书与 OG 图（约 600KB/笔）
          # 不断变大，浅克隆可让这部分成本不随时间增长。
          # 下面的 push 重试逻辑已实测在 --depth 1 下可用（必要时 git 会自动加深）。
          fetch-depth: 1

      # 镜像自带 Node 22（满足 package.json 的 engines: >=20），
      # 原先 setup-node 请求 Node 20 不在镜像缓存里，每次要下载一遍（实测 5s）。
      # 这里改为直接用镜像的 Node，并显式断言版本，避免悄悄跑在过旧的运行时上。
      - name: Verify Node version
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) { console.error('Node 版本过低：' + process.versions.node); process.exit(1); }"

      # 证书 PDF 与 OG 图都靠无头 Chrome 渲染。这里原先装的是 chromium-browser，
      # 而 Ubuntu 24.04 上那只是 snap 占位包，渲染必然失败——第一笔真实订单会卡在
      # 生成证书这一步。改为与另外两个 workflow 共用同一份安装逻辑。
      - name: Set up render environment (Chrome + bundled CJK fonts)
        uses: ./.github/actions/setup-render-env

      - name: Allocate star, render certificate and OG image, send email
        env:
          # Webhook 载荷（Zapier/Make 通过 client_payload 传入）
          STARORG_ORDER_JSON: ${{ toJSON(github.event.client_payload) }}
          # 人工补单时的输入（仅 workflow_dispatch 生效）
          INPUT_ORDER_ID: ${{ inputs.order_id }}
          INPUT_DISPLAY_NAME: ${{ inputs.display_name }}
          INPUT_EMAIL: ${{ inputs.email }}
          INPUT_DEDICATION: ${{ inputs.dedication }}
          INPUT_ANONYMOUS: ${{ inputs.anonymous }}
          # 密钥：一律来自 Actions Secrets，不写入代码库
          STARORG_SLUG_SECRET: ${{ secrets.STARORG_SLUG_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://star.org' }}
          REGISTRY_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -n "${{ inputs.display_name }}" ]; then
            export STARORG_ORDER_JSON=$(jq -n \
              --arg order_id "$INPUT_ORDER_ID" \
              --arg display_name "$INPUT_DISPLAY_NAME" \
              --arg email "$INPUT_EMAIL" \
              --arg dedication "$INPUT_DEDICATION" \
              --argjson anonymous "${INPUT_ANONYMOUS:-false}" \
              '{order_id:$order_id, display_name:$display_name, email:$email, dedication:$dedication, anonymous:$anonymous, source:"manual"}')
          fi
          # pipefail：默认管道只看最后一个命令的退出码，node 失败会被 tee 的成功掩盖，
          # 结果就是"分配失败但步骤显示成功"，运维只能在下个步骤看到莫名的 JSON 解析错误。
          # 但售罄（3）与未付款订单（5）都是预期内的业务状态，不能把整条流水线标红。
          set +e
          set -o pipefail
          node scripts/register.mjs | tee register-result.json
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::warning::Star pool is sold out; no claim was created (the operator has been notified to restock)"
            exit 0
          fi
          if [ "$code" = "5" ]; then
            echo "::warning::Order was not paid successfully; no claim was created (the customer may have abandoned payment or asked for a refund)"
            exit 0
          fi
          exit "$code"

      - name: Commit the claim record (one independent commit per claim)
        run: |
          if [ ! -s register-result.json ]; then
            echo "::error::No claim result was produced (invalid payload or allocation failure). Nothing will be committed; see the previous step log"
            exit 1
          fi
          SLUG=$(node -e "const r=require('./register-result.json'); console.log(r.slug||'')")
          if [ -z "$SLUG" ]; then echo "No claim produced (the pool may be sold out); skipping commit"; exit 0; fi
          git config user.name "star-org-bot"
          git config user.email "bot@star.org"
          git add data/stars_pool.json data/registrations data/registry-index.json certificates og
          if git diff --cached --quiet; then
            echo "No changes; skipping commit"
          else
            git commit -m "认领 $SLUG"
            # 提交期间可能有别的提交进到 main（人工修数据、另一次认领），
            # 直接 push 会被拒；先 rebase 再推，避免认领记录白白丢掉。
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "Push attempt $attempt failed; syncing with the remote and retrying"
              git pull --rebase --autostash origin main
              [ "$attempt" = "3" ] && { echo "::error::Push failed 3 times in a row; the claim record was not committed. Please re-issue manually"; exit 1; }
            done
          fi

      - name: Archive on failure (for manual re-issue)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: register-failure-log
          path: register-result.json
          if-no-files-found: ignore
