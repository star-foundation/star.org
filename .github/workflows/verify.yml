name: Verify (tests + compliance)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天巡检一次：确认登记表没有重复分配、没有隐私字段泄漏
    - cron: '0 3 * * *'
  workflow_dispatch:

# 连续推送时取消上一次未跑完的自检，避免白烧 CI 时间
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 镜像自带 Node 22（满足 package.json 的 engines: >=20），
      # 原先 setup-node 请求 Node 20 不在镜像缓存里，每次要下载一遍（实测 5s）。
      # 这里改为直接用镜像的 Node，并显式断言版本，避免悄悄跑在过旧的运行时上。
      - name: Verify Node version
        run: |
          node --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) { console.error('Node 版本过低：' + process.versions.node); process.exit(1); }"
      - name: Set up render environment (Chrome + bundled CJK fonts)
        uses: ./.github/actions/setup-render-env
      - name: Registry self-check (TC-REG-03 / TC-REG-04)
        run: node scripts/verify-registry.mjs
      - name: Compliance copy scan (TC-COMP-01~04)
        run: node scripts/check-compliance.mjs
      - name: Secrets and privacy scan (no keys or order PII in the public repo)
        run: node scripts/check-secrets.mjs
      - name: Test suite (including 3 rounds of the TC-ALLOC-03 oversell concurrency test)
        run: |
          # Chrome 路径由 setup-render-env 统一导出；缺失时给出明确提示而不是让测试莫名失败
          if [ ! -x "${CHROME_PATH:-}" ]; then echo "::error::Chrome unavailable: ${CHROME_PATH:-<unset>}"; exit 1; fi
          npm test
      - name: Star pool status
        run: |
          node -e "
          const pool = require('./data/stars_pool.json');
          const available = pool.stars.filter((s) => s.status === 'available').length;
          console.log('候选库总数', pool.stars.length, '可登记', available);
          if (available < 50) console.log('::warning::Fewer than 50 stars remain; please restock stars_pool.json soon');
          "
