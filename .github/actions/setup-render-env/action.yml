name: Set up render environment (Chrome + bundled CJK fonts)
description: >-
  Renders the certificate PDF and OG share image with headless Chrome, and
  renders Chinese with a font subset bundled in this repository.
  Two facts drive the approach here:
    1. The ubuntu-latest runner image **already ships Google Chrome** (see
       actions/runner-images, Ubuntu2404-Readme), so installing it on every run
       is pure waste;
    2. The CJK fonts are **bundled in the repository** (fonts/, a ~12.5MB
       trimmed subset - see DECISIONS D10). The runner image has no CJK fonts,
       and this workflow used to apt-install fonts-noto-cjk (the full
       multilingual build, ~60MB) and cache it on every run, which made
       "what the certificate looks like" depend on the runner environment.
       Bundling makes rendering fully deterministic and reproducible offline,
       so this step no longer needs any network access or installation.
  All three workflows share this single piece of logic, so one copy can never
  quietly drift again - register.yml once used the snap placeholder package
  chromium-browser, which meant the first real order would stall while
  generating its certificate.

outputs:
  chrome-path:
    description: Path to the usable Chrome executable
    value: ${{ steps.detect.outputs.path }}

runs:
  using: composite
  steps:
    - name: Locate Chrome (reuse the runner image copy when possible)
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        for candidate in "${CHROME_PATH:-}" /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome; do
          if [ -n "$candidate" ] && [ -x "$candidate" ]; then
            echo "Reusing the Chrome preinstalled in the runner image: $candidate"
            "$candidate" --version
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            # 统一导出给后续步骤，避免每个 workflow 各写一份路径（写错就整条链路失败）
            echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
            exit 0
          fi
        done

        echo "::warning::No preinstalled Chrome found; falling back to installing from the official apt repository (slower)"
        # 注意：gpg 不能以 sudo 运行（无 TTY 时会报 cannot open /dev/tty），
        # 改为普通用户解钥、再用 sudo install 落盘。
        wget -q -O /tmp/google-chrome.pub https://dl-ssl.google.com/linux/linux_signing_key.pub
        gpg --no-tty --batch --yes --dearmor -o /tmp/google-chrome.gpg /tmp/google-chrome.pub
        sudo install -D -m 0644 /tmp/google-chrome.gpg /usr/share/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
          | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends google-chrome-stable
        echo "path=/usr/bin/google-chrome" >> "$GITHUB_OUTPUT"
        echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
        /usr/bin/google-chrome --version

    - name: Validate the render environment
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -x "${CHROME_PATH:-}" ]; then
          echo "::error::CHROME_PATH=${CHROME_PATH:-<unset>} is not executable; certificates and OG images cannot be rendered"
          exit 1
        fi
        echo "Chrome：$CHROME_PATH"
        "$CHROME_PATH" --version

        # 内置字体必须与清单一致：字节被换掉而没人发现的话，
        # 变化会直接体现到已发给客户的证书上。
        node scripts/fetch-fonts.mjs --check
