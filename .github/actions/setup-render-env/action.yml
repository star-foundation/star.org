name: 准备渲染环境（Chrome + 内置中文字体）
description: >-
  证书 PDF 与 OG 分享图靠无头 Chrome 渲染，中文靠仓库内置的字体子集。
  两个前提决定了这里的做法：
    1. ubuntu-latest 镜像**已预装 Google Chrome**（见 actions/runner-images 的
       Ubuntu2404-Readme），每次再 apt 装一遍纯属浪费；
    2. 中文字体**随仓库内置**（assets/fonts，约 12.5MB 的裁剪子集，见 DECISIONS D10）。
      镜像里没有中文字体，原先每次 CI 都 apt 安装 fonts-noto-cjk（多语言全量版，
      约 60MB）并缓存——那让"证书长什么样"依赖运行环境是否装过字体。
      改为内置后渲染完全确定、离线可复现，这一步不再需要任何网络与安装。
  三个 workflow 共用这一份逻辑，避免再次出现"某一份悄悄走偏"——register.yml
  曾误用 snap 占位包 chromium-browser，导致第一笔真实订单会卡在生成证书。

outputs:
  chrome-path:
    description: 可用的 Chrome 可执行文件路径
    value: ${{ steps.detect.outputs.path }}

runs:
  using: composite
  steps:
    - name: 定位 Chrome（优先复用镜像预装）
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        for candidate in "${CHROME_PATH:-}" /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome; do
          if [ -n "$candidate" ] && [ -x "$candidate" ]; then
            echo "复用镜像预装的 Chrome：$candidate"
            "$candidate" --version
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            # 统一导出给后续步骤，避免每个 workflow 各写一份路径（写错就整条链路失败）
            echo "CHROME_PATH=$candidate" >> "$GITHUB_ENV"
            exit 0
          fi
        done

        echo "::warning::未找到预装 Chrome，回退到官方 apt 源安装（较慢）"
        # 注意：gpg 不能以 sudo 运行（无 TTY 时会报 cannot open /dev/tty），
        # 改为普通用户解钥、再用 sudo install 落盘。
        wget -q -O /tmp/google-chrome.pub https://dl-ssl.google.com/linux/linux_signing_key.pub
        gpg --no-tty --batch --yes --dearmor -o /tmp/google-chrome.gpg /tmp/google-chrome.pub
        sudo install -D -m 0644 /tmp/google-chrome.gpg /usr/share/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
          | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends google-chrome-stable
        echo "path=/usr/bin/google-chrome" >> "$GITHUB_OUTPUT"
        echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
        /usr/bin/google-chrome --version

    - name: 校验渲染环境可用
      shell: bash
      run: |
        set -euo pipefail

        if [ ! -x "${CHROME_PATH:-}" ]; then
          echo "::error::CHROME_PATH=${CHROME_PATH:-<未设置>} 不可执行，证书与 OG 图将无法渲染"
          exit 1
        fi
        echo "Chrome：$CHROME_PATH"
        "$CHROME_PATH" --version

        # 内置字体必须与清单一致：字节被换掉而没人发现的话，
        # 变化会直接体现到已发给客户的证书上。
        node scripts/fetch-fonts.mjs --check
