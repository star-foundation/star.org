<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · {{siteName}}</title>
<script>
// 这个文件会被 GitHub Pages 用来兜底任意不存在的路径，页面自身的 URL 层级不可预知。
// 先把站点根固定下来，下面的相对路径在「自定义域名根路径」与「项目子路径」下才能都解析正确。
(function () {
  var project = '{{projectBase}}';
  var root = location.pathname.indexOf(project) === 0 ? project : '/';
  document.write('<base href="' + root + '">');
})();
</script>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<header class="site">
  <div class="wrap nav">
    <div class="brand"><a href="/">{{siteName}}</a></div>
    <nav class="nav-links">
      <a href="/registry/">公开登记表</a>
      <a href="/#faq">常见问题</a>
      {{#if checkoutReady}}<a class="btn btn-primary btn-sm" href="/register/">登记一颗星</a>{{/if}}
    </nav>
  </div>
</header>
<main>
  <section class="plain" style="padding-top:80px;">
    <div class="wrap narrow center">
      <h1 style="font-size:clamp(26px,4vw,38px);">这条链接上暂时没有记录</h1>
      <p class="lede" style="margin-left:auto;margin-right:auto;">
        可能是链接被复制得不完整，或者这条登记尚未生成完成（生成通常在付款后几分钟内完成）。
      </p>
      <div class="hero-actions" style="justify-content:center;">
        <a class="btn btn-primary" href="/registry/">去公开登记表查找</a>
        <a class="btn btn-ghost" href="/">返回首页</a>
      </div>
      <p class="muted" style="margin-top:22px;font-size:14px;">
        如果刚刚完成付款、超过 5 分钟仍打不开链接，请来信 {{supportEmail}}，我们会人工处理。
      </p>
    </div>
  </section>
</main>
<footer class="site">
  <div class="wrap muted">© {{year}} {{siteName}}</div>
</footer>
</body>
</html>
