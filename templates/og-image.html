<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(120% 120% at 18% 12%, #1b2440 0%, #10162a 45%, #0a0e1c 100%);
    color: #f2efe8;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { position: relative; width: 1200px; height: 630px; padding: 62px 72px; display: flex; flex-direction: column; }
  .stars { position: absolute; inset: 0; }
  .glow { position: absolute; width: 520px; height: 520px; right: -120px; top: -140px;
          background: radial-gradient(circle, rgba(143,166,209,0.30) 0%, rgba(143,166,209,0) 68%); }
  .brand { font-size: 20px; letter-spacing: 0.44em; color: #8fa6d1; text-transform: uppercase; }
  .content { margin-top: auto; }
  .kicker { font-size: 19px; color: #9aa4bb; letter-spacing: 0.16em; }
  h1 { font-size: 76px; line-height: 1.08; margin: 10px 0 0; font-weight: 600;
       font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Times New Roman", serif; }
  .sub { margin-top: 14px; font-size: 23px; color: #b9c1d2; letter-spacing: 0.05em; }
  .dedication { margin-top: 22px; font-size: 25px; line-height: 1.6; color: #e6e1d4; max-width: 900px;
                font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;
          font-size: 20px; color: #8b95ab; letter-spacing: 0.04em; }
  .badge { display: inline-block; padding: 9px 20px; border: 1px solid rgba(143,166,209,0.55);
           border-radius: 999px; font-size: 18px; color: #b6c5e2; letter-spacing: 0.12em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <svg class="stars" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">{{starFieldSvg!}}</svg>
  <div class="brand">{{brandName}}</div>
  <div class="content">
    <div class="kicker">恒星认领证书 · 编号 {{slug}}</div>
    <h1>{{starTitle}}</h1>
    <div class="sub">{{starSubtitle}}</div>
    {{#if dedication}}
    <div class="dedication">{{dedication}}</div>
    {{/if}}
  </div>
  <div class="foot">
    <div>{{registeredDateZh}} · {{starId}} · 距地球 {{distanceText}}</div>
    <div class="badge">可公开验证</div>
  </div>
</div>
</body>
</html>
